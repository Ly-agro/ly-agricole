# À ajouter sur une machine avec carte NVIDIA (pilotes + nvidia-container-toolkit) :
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  ollama:
    environment:
      OLLAMA_NUM_PARALLEL: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
